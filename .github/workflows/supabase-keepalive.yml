# === SUPABASE KEEP-ALIVE ===
# Free Supabase projects pause after ~1 week of inactivity.
# This sends one harmless read request every 3 days. Uses only the public
# publishable key (same as sync.js). Never put a secret/service_role key here.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          # The table is private for anonymous users, so 401 is the expected answer.
          # The request still reaches the database, which counts as activity.
          code=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            -H "apikey: sb_publishable_mJRdYTkV7YJ9EoovFVxH0w_Z7X53v3p" \
            "https://dntwvlruqzxyiqtdltmb.supabase.co/rest/v1/user_data?select=user_id&limit=1")
          echo "Supabase answered $code"
          case "$code" in 200|401) exit 0 ;; *) exit 1 ;; esac
